<!--@ receita | Fluxo de Receita · Portal DR-E Grupo OLX | Árvore de Produção de Receita | Mapa editável do caminho do dinheiro no B2B do Grupo OLX. Status e notas apurados na transcrição do kick-off de 24/08; cada nó aponta a pergunta do bloco 3B que o fecha. | v2 · 26 ago 2026 -->
<style>
.bar{top:3.5rem}
/* Esta pagina nao tem indice para o trilho listar, e a arvore precisa da
   largura toda: sem isto ela fica presa na coluna de ~1000px do documento e
   corta nos dois lados. */
.doc{grid-template-columns:minmax(0,1fr)!important;gap:0!important;max-width:none}
.rail,.rail-abrir{display:none!important}

/* ---------- árvore ----------
   Cresce de baixo para cima: a semente na base, e cada nível abrindo os ramos
   numa fileira horizontal acima do nó que os gerou. */
/* Superfície de canvas: a área da árvore vira um viewport com pan e zoom
   próprios. O palco é o alvo do transform e tem a largura do viewport em
   escala 1, então a árvore continua se distribuindo em colunas por dentro. */
.canvas{position:relative;width:100vw;margin-left:calc(50% - 50vw);
  height:clamp(28rem,calc(100vh - 11rem),60rem);overflow:hidden;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);
  background-size:24px 24px;cursor:grab;touch-action:none;overscroll-behavior:contain}
.canvas.is-pan{cursor:grabbing}
/* Durante o arrasto nada aqui e selecionavel. O preventDefault do pointerdown ja impede a
   selecao de comecar; isto e a segunda trava, para o caso de o arrasto iniciar de outro jeito. */
.canvas.is-pan,.canvas.is-pan *{-webkit-user-select:none;user-select:none}
.stage{position:absolute;top:0;left:0;width:max-content;transform-origin:0 0;
  padding:2rem clamp(1rem,3vw,2.5rem);will-change:transform}

.hud{position:absolute;right:1rem;bottom:1rem;z-index:3;display:flex;align-items:center;
  gap:.2rem;padding:.25rem;background:var(--card);border:1px solid var(--border);
  border-radius:99px;box-shadow:var(--shadow-card)}
.hud button{font:inherit;font-size:.78rem;line-height:1;border:0;background:transparent;
  color:var(--muted-fg);border-radius:99px;padding:.4rem .6rem;cursor:pointer}
.hud button:hover{background:var(--muted);color:var(--fg)}
.hud button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.hud output{font-family:var(--mono);font-size:.72rem;color:var(--fg);
  min-width:3rem;text-align:center;-webkit-user-select:none;user-select:none}
.hud .sep{width:1px;height:1.1rem;background:var(--border);margin:0 .15rem}
.dica{position:absolute;left:1rem;bottom:1rem;z-index:3;font-size:.7rem;color:var(--muted-fg);
  background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--border);
  border-radius:99px;padding:.3rem .7rem;pointer-events:none}
/* --g é a folga entre uma fileira e o nó que a gerou: metade dela é o tronco
   que sobe do pai, metade é o que desce até cada filho, e a barra dos irmãos
   fica na emenda. */
.tree{--g:2.4rem;display:inline-block}
.tree ul{position:relative;display:flex;justify-content:center;align-items:stretch;
  list-style:none;margin:0;padding:0}
.tree li{position:relative;display:flex;flex-direction:column-reverse;align-items:center;
  padding:0 .45rem var(--g)}
.tree li::before{content:"";position:absolute;left:50%;bottom:calc(var(--g)/2);
  height:calc(var(--g)/2);border-left:1px solid var(--border-strong)}
.tree li::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--g)/2);
  border-top:1px solid var(--border-strong)}
.tree li:first-child::after{left:50%}
.tree li:last-child::after{right:50%}
.tree li:only-child::after{display:none}
.tree ul::before{content:"";position:absolute;left:50%;bottom:0;
  height:calc(var(--g)/2);border-left:1px solid var(--border-strong)}
/* a semente não tem nada abaixo dela */
.tree > ul{align-items:flex-end}
.tree > ul::before{display:none}
.tree > ul > li{padding-bottom:0}
.tree > ul > li::before,.tree > ul > li::after{display:none}

/* ---------- nó ---------- */
.nd{position:relative;width:12.5rem;flex:none;background:var(--card);
  border:1px solid var(--border);border-left:3px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:.55rem .65rem;box-shadow:var(--shadow-card)}
.nd:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--accent)}
.nd--raiz{border-left-color:var(--brand);background:var(--accent);
  border-bottom:3px solid var(--brand)}
.nd[data-s="confirmado"]{border-left-color:var(--ok)}
.nd[data-s="hipotese"]{border-left-color:var(--warn)}
.nd[data-s="aberto"]{border-left-color:var(--border-strong);border-left-style:dashed}
.nd-t{font-size:.84rem;font-weight:500;line-height:1.35;outline:none;min-height:1.2em}
.nd-t:empty::before{content:"Sem nome";color:var(--muted-fg);font-weight:400}
.nd-n{font-size:.72rem;line-height:1.4;color:var(--muted-fg);margin-top:.25rem;outline:none}
.nd-n:not(:focus){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nd-n:empty::before{content:"nota";color:var(--border-strong)}
.nd-f{display:flex;align-items:center;gap:.35rem;margin-top:.45rem;flex-wrap:wrap}
.nd-s{font:inherit;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;
  letter-spacing:.06em;border:1px solid var(--input);background:var(--bg);color:var(--muted-fg);
  border-radius:99px;padding:.12rem .5rem;cursor:pointer}
.nd[data-s="confirmado"] .nd-s{background:var(--ok-bg);color:var(--ok);
  border-color:color-mix(in srgb,var(--ok) 40%,transparent);font-weight:600}
.nd[data-s="hipotese"] .nd-s{background:var(--warn-bg);color:var(--warn);
  border-color:color-mix(in srgb,var(--warn) 40%,transparent);font-weight:600}
.nd-q{font-family:var(--mono);font-size:.64rem;color:var(--muted-fg);
  border:1px solid var(--input);border-radius:99px;padding:.12rem .45rem;
  text-decoration:none;cursor:pointer}
.nd-q:hover{color:var(--brand-ink);border-color:var(--brand)}
.nd-ops{display:flex;gap:.15rem;margin-left:auto;opacity:0;transition:opacity .12s}
.nd:hover .nd-ops,.nd:focus-within .nd-ops{opacity:1}
.nd-op{font:inherit;font-size:.8rem;line-height:1;width:1.3rem;height:1.3rem;display:grid;
  place-items:center;border:1px solid var(--input);background:var(--bg);color:var(--muted-fg);
  border-radius:.3rem;cursor:pointer;padding:0}
.nd-op:hover{color:var(--fg);border-color:var(--border-strong)}
.nd-op[data-op="del"]:hover{color:var(--brand-ink);border-color:var(--brand)}
.nd-col{position:absolute;left:50%;top:-.65rem;transform:translateX(-50%);z-index:2;
  width:1.15rem;height:1.15rem;border-radius:99px;border:1px solid var(--border-strong);
  background:var(--card);color:var(--muted-fg);font:inherit;font-size:.62rem;line-height:1;
  display:grid;place-items:center;cursor:pointer;padding:0;font-family:var(--mono)}
.nd-col:hover{color:var(--fg);border-color:var(--fg)}
li.is-col > ul{display:none}

@media print{
  .bar,.toast,.hud,.dica{display:none}
  .canvas{height:auto;overflow:visible;border:0;background-image:none}
  .stage{position:static;transform:none!important;padding:0}
  .nd-ops,.nd-col{display:none}
}
</style>

<script>
// ============================================================================
// Arvore de producao de receita. Modelo unico em memoria, render inteiro a cada
// mudanca estrutural: a arvore e pequena e isso elimina qualquer divergencia
// entre DOM e estado. Texto e editado in loco e salvo com debounce.
// ============================================================================
// v2: a arvore deixou de ser so a hipotese de leitura do contrato. Os status e as notas vieram
// da transcricao integral do kick-off de 24/08, apurada em
// 06-reunioes/2026-08-24-kickoff-o-que-a-transcricao-fecha.md. A chave subiu de v1 para v2 porque
// carregar() prefere o localStorage ao SEED: sem trocar a chave, quem ja abriu a pagina continuaria
// vendo a arvore antiga do proprio navegador.
const CHAVE = "dre-arvore-receita-v2";

// s: aberto | hipotese | confirmado · q: pergunta do bloco 3B que fecha o no
const SEED = {
  t: "Receita B2B do Grupo OLX", s: "hipotese", q: "3B-1",
  n: "Modelo de classificados: o anunciante compra inserção e posição (pay per listing), com produtos de visibilidade por cima. Declaração do próprio cliente: 'a gente vende exatamente os mesmos produtos de 15 anos atrás'. Escopo do DR-E fechado em 24/08: Autos e Imóveis, com Goods fora.",
  c: [
    { t: "Origem do valor: audiência B2C", s: "confirmado", q: "3B-6", n: "Não é gerida. Perguntados sobre rentabilizar o lead B2C: 'a gente não faz nada intencional em cima disso, a gente gera leads'. O que existe é uma atribuição feita no ano passado com o FP&A, e por rateio dos planos vendidos. Escala declarada, a confirmar formalmente: cerca de 50 mi de usuários por mês, cerca de 4,5 mi de leads por mês, 2,6 leads por usuário em real estate. Confirmação inversa: quando o anunciante sai, o inventário dele sai junto, a oferta cai e a conversão do lado do consumidor cai.", c: [
      { t: "Taxa de resposta ao lead", s: "confirmado", q: "3B-6", n: "Entre 50% e 58% das imobiliárias respondem o lead entregue, medido por cliente oculto e batendo com o benchmark internacional. Perto de metade do que a plataforma entrega não recebe resposta nenhuma, e isso não é falha de geração, é perda no outro lado do marketplace.", c: [] }
    ]},

    { t: "Frente Imóveis", s: "confirmado", q: "3B-2", n: "Triple Bundle: o contrato é com o Grupo OLX e a entrega é distribuída em ZAP+, VivaReal e OLX Imóveis. O anunciante recebe leads dos três e não sabe de qual portal veio cada um. Consequência para a leitura: ele é um registro na base, não três, e ticket, base ativa e churn precisam ser lidos no Grupo.", c: [
      { t: "Imobiliária", s: "confirmado", q: "3B-0", n: "Contraparte principal. Mercado sem exclusividade, o que gera duplicidade de anúncio: 193 mil anúncios deduplicados contra cerca de 1,5 mi duplicados (cifra a confirmar, a transcrição corrompe o número). A deduplicação é disputada: as imobiliárias descobrem o algoritmo e fogem dele. Falta a unidade de cobrança formal: por CNPJ, por rede ou por loja.", c: [
        { t: "Plano por volume de anúncios", s: "confirmado", q: "3B-1", n: "Pacotes de 10, 12, 14 e 15 anúncios. A unidade de valor é o slot de anúncio ativo, não o lead. Sem garantia de performance: pode receber zero ou mil. Pré-pago na grande maioria.", c: [] },
        { t: "Destaque e impulsionamento", s: "confirmado", q: "3B-1", n: "Produtos de visibilidade. Lá fora são de 30% a 50% da receita em real estate, muito acima do share atual da OLX. Limite declarado por Leonardo Costa: já estão saturados aqui dentro.", c: [] },
        { t: "Tier de plano", s: "hipotese", q: "3B-1", n: "Existem ao menos três tiers e o básico não recebe lead similar. O tier é variável de preço e de entrega ao mesmo tempo. Confirmar quantos são e o que muda em cada um.", c: [] }
      ]},
      { t: "Corretor autônomo", s: "hipotese", q: "3B-0", n: "Perfil confirmado como B2B: 'se você é um corretor ou uma imobiliária, você é imóveis'. Peso na receita desconhecido.", c: [] },
      { t: "Incorporadora", s: "hipotese", q: "3B-0", n: "Mercado primário, ciclo e ticket diferentes. Pay per lead já foi testado com incorporadoras, e a calculadora Minha Casa Minha Vida gera lead genérico distribuído para esse mercado.", c: [
        { t: "Contrato de mídia", s: "aberto", q: "3B-1", n: "Sem sinal na transcrição. Campanha por empreendimento? Preço por período ou por entrega?", c: [] }
      ]}
    ]},

    { t: "Frente Autos", s: "confirmado", q: "3B-3", n: "Marca única OLX, o que simplifica a leitura em relação a Imóveis. Mesmo modelo de classificados. Diferença que importa: 'o mercado automotivo já está acostumado com esse modelo pay per use', então a fricção para mudar a cobrança é menor deste lado.", c: [
      { t: "Locadora e grandes contas", s: "confirmado", q: "3B-3", n: "Já operam em pay per lead hoje. É o único ponto da árvore onde o modelo alternativo de cobrança roda em produção, e por isso é a melhor base de comparação que existe para o teste aprovado no kick-off.", c: [] },
      { t: "Concessionária", s: "hipotese", q: "3B-0", n: "Existe. Contrato por rede ou por loja segue aberto.", c: [] },
      { t: "Revenda / dealer", s: "hipotese", q: "3B-0", n: "Existe, mas o termo continua sem definição do cliente: revenda multimarca, loja de bairro ou rede.", c: [] },
      { t: "Vendedor pessoa física", s: "hipotese", q: "3B-0", n: "Leonardo Costa cuida 'de privados e profissionais', o que sugere segmentação formal entre os dois. Confirmar se o privado gera receita ou é gratuito, e se está dentro do recorte B2B.", c: [] },
      { t: "Sobrou operação transacional?", s: "hipotese", q: "3B-3", n: "Hipótese negativa: nenhuma menção a comissão sobre venda de veículo nem a compra e venda direta, em duas horas de conversa sobre receita de autos. Ausência confirmada também é resposta.", c: [] }
    ]},

    { t: "Canal indireto", s: "hipotese", q: "3B-7", n: "Hipótese negativa: nenhuma revenda, franquia ou agência vendendo em nome do grupo foi citada. O que existe é parceiro dentro da jornada, abaixo.", c: [
      { t: "Parceiro financeiro", s: "hipotese", q: "3B-7", n: "Banco e financeira pagam para entrar na jornada e recebem o lead do lojista via OLX. Não é anunciante e não aparece como linha, mas gera receita. Dimensionar.", c: [] }
    ]},

    { t: "Formação do preço", s: "hipotese", q: "3B-9", n: "Nó ativo do sistema: é aqui que aconteceu o movimento de 2026 que está por trás do churn declarado.", c: [
      { t: "Tabela por porte e praça", s: "hipotese", q: "3B-9", n: "A escada de pacotes (10, 12, 14, 15) funciona como tabela, e existe leitura regional nas metas. A tabela vigente não foi entregue.", c: [] },
      { t: "Desconto praticado", s: "confirmado", q: "3B-9", n: "Aumento expressivo de preço em 2026, apoiado em consultoria de pricing e benchmark, com objetivo declarado de recuperar rentabilidade. Somado à queda de performance percebida pelo anunciante em mercado mais competitivo, virou churn e downgrade: 'talvez aí tenha sido o nosso movimento não muito inteligente'. Havia condição especial na recontratação e ela foi endurecida. Falta o desconto médio praticado por segmento.", c: [] },
      { t: "Sem garantia de performance", s: "confirmado", q: "3B-1", n: "O anunciante novo não tem resultado garantido: 'ele pode comprar um plano de cinco anúncios e em um mês não receber nenhum. A gente deveria blindar essa aquisição e a gente não garante'. É a fricção entre atenção e ação, e foi nomeada pelo próprio cliente como causa de churn.", c: [] },
      { t: "Alavanca de expansão", s: "confirmado", q: "3B-4", n: "Três alavancas: upgrade na escada de pacotes, produtos de visibilidade, e rentabilização de carteira pelo executivo comercial, apoiada por uma visão chamada Spark. Teto declarado: a visibilidade já está saturada.", c: [] },
      { t: "Onde está a margem", s: "hipotese", q: "3B-5", n: "Margem bruta praticamente 100%, porque não há produto fabricado. Ofensores: mídia e imposto. Não existe abertura de margem por linha, então a pergunta útil vira composição de receita: quanto é listing e quanto é visibilidade.", c: [] }
    ]},

    { t: "Caminho do dinheiro até a conta", s: "hipotese", q: "3B-11", n: "Multi-handoff confirmado por declaração: 'tem produto, tem marketing, tem operações, tem time comercial, e você tem interfaces diversas'. E a própria OLX precisou de um workshop interno para conseguir desenhar a jornada.", c: [
      { t: "Entrada por canal", s: "confirmado", q: "3B-11", n: "Três portas conforme o porte e a lucratividade: canal online (self-service, entrada de clientes menores), inside sales (telefone e WhatsApp) e field sales (clientes maiores). Hunter e farmer separados: 'quem faz essa primeira entrada não é necessariamente quem rentabiliza', podendo coincidir nas contas grandes.", c: [] },
      { t: "Contrato assinado", s: "aberto", q: "3B-11", n: "Quem precifica e quem aprova exceção de desconto continua sem resposta. É o handoff menos visível da cadeia e o que fecha 3B-9.", c: [] },
      { t: "Faturamento", s: "confirmado", q: "3B-11", n: "Pré-pago na grande maioria de Imóveis, pós-pago nas contas de campo.", c: [] },
      { t: "Cobrança e inadimplência", s: "confirmado", q: "3B-10", n: "Gestão de pagamento cobra a carteira de maior receita no pré-pago; time de cobrança persegue receita devida no pós-pago. Nenhum dos dois olha a performance do cliente: 'é um time de cobrança mais focado em contas a receber'.", c: [] },
      { t: "Renovação", s: "confirmado", q: "3B-10", n: "No pré-pago renova quem paga de novo, e quem para de pagar morre em silêncio: 'o churn não é um churn, ele só para de pagar, não renova'. Atuação por IA e régua de touch. Não existe CS de retenção olhando se o cliente está tendo resultado; o papel consultivo mora no executivo comercial e só nas contas maiores.", c: [] },
      { t: "Remuneração do comercial", s: "confirmado", q: "3B-11", n: "Variável em 75% carteira e 25% scorecard estratégico. Sem indicador de retenção, de qualidade da base ou de atendimento: foi discutido e não implementado. Num negócio cuja restrição percebida é retenção, é a candidata mais forte a política implícita da causa-raiz.", c: [] }
    ]},

    { t: "Linhas fora da árvore", s: "confirmado", q: "3B-12", n: "Seis candidatos apareceram, todos ancorados no lado B2C que hoje não é monetizado de forma intencional. É onde mora a receita que a leitura atual do sistema ignora.", c: [
      { t: "Lead similar", s: "confirmado", q: "3B-12", n: "Contato distribuído a no máximo três imobiliárias, por opt-out, disponível só nos tiers superiores de plano. Corresponde a 5% do volume total de leads. O que trava a monetização própria é a percepção de qualidade pior, e portanto o pricing point.", c: [] },
      { t: "Calculadora Minha Casa Minha Vida", s: "confirmado", q: "3B-12", n: "Gera lead genérico para o mercado primário e distribui. Já em produção.", c: [] },
      { t: "Lead de financiamento em Autos", s: "confirmado", q: "3B-12", n: "Já enriquecido com valor de entrada pretendido e status de aprovação de crédito.", c: [] },
      { t: "Enriquecimento de lead", s: "hipotese", q: "3B-12", n: "Ferramenta com lançamento previsto em evento de outubro de 2026. Em Imóveis, a calculadora de financiamento está no roadmap.", c: [] },
      { t: "WhatsApp B2C com IA de recomendação", s: "hipotese", q: "3B-12", n: "Em construção com a Meta, com incentivo comercial da própria Meta. Ainda não é linha de receita.", c: [] }
    ]},

    { t: "Frente Goods", s: "confirmado", q: "3B-12", n: "Fora do escopo do DR-E por decisão do kick-off de 24/08: 'a goods, a gente deixa de lado'. Fica na árvore só para registrar que a exclusão foi deliberada, não esquecimento.", c: [] }
  ]
};

const ORDEM = ["aberto", "hipotese", "confirmado"];
const ROTULO = { aberto: "aberto", hipotese: "hipótese", confirmado: "confirmado" };

let arvore = carregar();

function carregar() {
  try {
    const cru = localStorage.getItem(CHAVE);
    if (cru) return JSON.parse(cru);
  } catch (e) {}
  return JSON.parse(JSON.stringify(SEED));
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(arvore)); } catch (e) {}
}
let tSalva;
function salvarDepois() { clearTimeout(tSalva); tSalva = setTimeout(salvar, 400); }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// caminho e um array de indices a partir da raiz: [] e a raiz, [0,2] o terceiro
// filho do primeiro filho. Serializado no data-p do no.
function achar(caminho) {
  let no = arvore;
  for (const i of caminho) no = no.c[i];
  return no;
}
function pai(caminho) { return achar(caminho.slice(0, -1)); }

function noHtml(no, caminho) {
  const p = caminho.join(",");
  const raiz = caminho.length === 0;
  const temFilho = no.c && no.c.length;
  return '<div class="nd' + (raiz ? " nd--raiz" : "") + '" data-s="' + esc(no.s || "aberto") +
    '" data-p="' + p + '">' +
    '<div class="nd-t" contenteditable="plaintext-only" data-campo="t" role="textbox" aria-label="Nome do nó">' + esc(no.t) + '</div>' +
    '<div class="nd-n" contenteditable="plaintext-only" data-campo="n" role="textbox" aria-label="Nota">' + esc(no.n || "") + '</div>' +
    '<div class="nd-f">' +
      '<button class="nd-s" type="button" data-op="status" title="Circular entre aberto, hipótese e confirmado">' + ROTULO[no.s || "aberto"] + '</button>' +
      (no.q ? '<a class="nd-q" href="/kickoff#b3B" title="Fecha na pergunta ' + esc(no.q) + ' do bloco 3B">' + esc(no.q) + '</a>' : "") +
      '<span class="nd-ops">' +
        '<button class="nd-op" type="button" data-op="filho" title="Adicionar filho" aria-label="Adicionar filho">+</button>' +
        (raiz ? "" : '<button class="nd-op" type="button" data-op="irmao" title="Adicionar irmão abaixo" aria-label="Adicionar irmão">&#8629;</button>') +
        (raiz ? "" : '<button class="nd-op" type="button" data-op="sobe" title="Mover para cima" aria-label="Mover para cima">&#8593;</button>') +
        (raiz ? "" : '<button class="nd-op" type="button" data-op="desce" title="Mover para baixo" aria-label="Mover para baixo">&#8595;</button>') +
        (raiz ? "" : '<button class="nd-op" type="button" data-op="del" title="Remover" aria-label="Remover">&times;</button>') +
      '</span>' +
    '</div>' +
    (temFilho ? '<button class="nd-col" type="button" data-op="col" title="Recolher ou expandir" aria-label="Recolher ou expandir">' + (no.col ? "+" : "&minus;") + '</button>' : "") +
    '</div>';
}

function ramoHtml(no, caminho) {
  const filhos = no.c && no.c.length
    ? '<ul>' + no.c.map((f, i) => ramoHtml(f, caminho.concat(i))).join("") + '</ul>'
    : "";
  return '<li' + (no.col ? ' class="is-col"' : "") + '>' + noHtml(no, caminho) + filhos + '</li>';
}

function render() {
  document.getElementById("tree").innerHTML = '<ul>' + ramoHtml(arvore, []) + '</ul>';
  const c = contar(arvore);
  document.getElementById("rv-cont").textContent =
    c.total + " nós · " + c.aberto + " abertos · " + c.hipotese + " hipóteses · " + c.confirmado + " confirmados";
}

function contar(no, acc) {
  acc = acc || { total: 0, aberto: 0, hipotese: 0, confirmado: 0 };
  acc.total++;
  acc[no.s || "aberto"]++;
  (no.c || []).forEach(f => contar(f, acc));
  return acc;
}

function novo() { return { t: "", s: "aberto", n: "", q: "", c: [] }; }

// ---------- edição ----------
const tree = document.getElementById("tree");

tree.addEventListener("input", e => {
  const campo = e.target.dataset.campo;
  if (!campo) return;
  const cam = e.target.closest(".nd").dataset.p;
  const no = achar(cam === "" ? [] : cam.split(",").map(Number));
  no[campo] = e.target.textContent;
  salvarDepois();
});

tree.addEventListener("click", e => {
  const b = e.target.closest("[data-op]");
  if (!b) return;
  const nd = b.closest(".nd");
  const cam = nd.dataset.p === "" ? [] : nd.dataset.p.split(",").map(Number);
  const no = achar(cam);
  const op = b.dataset.op;

  if (op === "status") {
    no.s = ORDEM[(ORDEM.indexOf(no.s || "aberto") + 1) % ORDEM.length];
  } else if (op === "col") {
    no.col = !no.col;
  } else if (op === "filho") {
    no.c = no.c || []; no.c.push(novo()); no.col = false;
  } else if (op === "irmao") {
    const p = pai(cam), i = cam[cam.length - 1];
    p.c.splice(i + 1, 0, novo());
  } else if (op === "sobe" || op === "desce") {
    const p = pai(cam), i = cam[cam.length - 1];
    const j = op === "sobe" ? i - 1 : i + 1;
    if (j < 0 || j >= p.c.length) return;
    p.c.splice(j, 0, p.c.splice(i, 1)[0]);
  } else if (op === "del") {
    const quantos = contar(no).total;
    const aviso = quantos > 1
      ? "Remover este nó e os " + (quantos - 1) + " abaixo dele?"
      : "Remover este nó?";
    if (!confirm(aviso)) return;
    const p = pai(cam);
    p.c.splice(cam[cam.length - 1], 1);
  } else {
    return;
  }
  salvar();
  render();
});

// ---------- exportação ----------
function md(no, nivel) {
  const ind = "  ".repeat(nivel);
  const marca = no.s === "confirmado" ? "" : (no.s === "hipotese" ? " `[E]`" : " `[aberto]`");
  let s = ind + "- **" + (no.t || "sem nome") + "**" + marca +
          (no.q ? " `" + no.q + "`" : "") + "\n";
  if (no.n) s += ind + "  " + no.n + "\n";
  (no.c || []).forEach(f => { s += md(f, nivel + 1); });
  return s;
}

function exportarMd() {
  const c = contar(arvore);
  return "# Árvore de produção de receita, Grupo OLX\n\n" +
    "> **v0, não confirmada.** " + c.confirmado + " nós confirmados, " + c.hipotese +
    " hipóteses e " + c.aberto + " abertos, de " + c.total + ".\n" +
    "> Cada nó não confirmado aponta a pergunta do bloco 3B do kick-off que o fecha.\n" +
    "> Hipótese é marcada `[E]` conforme a regra 2 do repositório.\n\n" +
    md(arvore, 0) +
    "\n---\n\nFonte: `portal/receita`. Exportado do mapa editável do portal.\n";
}

const dlg = document.getElementById("dlg");
const dlgTxt = document.getElementById("dlg-txt");
const toast = document.getElementById("toast");
function aviso(t) {
  toast.textContent = t; toast.classList.add("on");
  setTimeout(() => toast.classList.remove("on"), 2200);
}
function abrir(titulo, texto) {
  document.getElementById("dlg-tit").textContent = titulo;
  dlgTxt.value = texto;
  dlg.showModal();
}
document.getElementById("rv-md").onclick = () => abrir("Markdown para 03-estrategia/", exportarMd());
document.getElementById("rv-json").onclick = () =>
  abrir("JSON para dados/outputs/", JSON.stringify({ arvore: arvore }, null, 2));
document.getElementById("dlg-close").onclick = () => dlg.close();
document.getElementById("dlg-copy").onclick = async () => {
  try { await navigator.clipboard.writeText(dlgTxt.value); aviso("Copiado."); }
  catch (e) { dlgTxt.select(); aviso("Selecionado: use Cmd+C."); }
};

document.getElementById("rv-reset").onclick = () => {
  if (!confirm("Descartar as edições e voltar à semente inicial?")) return;
  arvore = JSON.parse(JSON.stringify(SEED));
  salvar(); render(); aviso("Semente restaurada.");
};

document.getElementById("rv-expand").onclick = function () {
  let algumRecolhido = false;
  (function varre(no) {
    if (no.col) algumRecolhido = true;
    (no.c || []).forEach(varre);
  })(arvore);
  (function aplica(no) {
    if (no.c && no.c.length) no.col = !algumRecolhido;
    (no.c || []).forEach(aplica);
  })(arvore);
  this.textContent = algumRecolhido ? "Recolher tudo" : "Expandir tudo";
  salvar(); render();
};

// ---------- viewport: pan e zoom ----------
// Transform no palco, nao zoom nem scroll: assim o zoom pode ancorar no ponteiro
// e o arrasto nao briga com a rolagem da pagina.
const CHAVE_V = "dre-arvore-receita-view";
const canvas = document.getElementById("canvas");
const stage  = document.getElementById("stage");
const pct    = document.getElementById("cv-pct");
const MIN = 0.2, MAX = 2;

let k = 1, tx = 0, ty = 0;

function aplica() {
  stage.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";
  pct.textContent = Math.round(k * 100) + "%";
}
function guarda() {
  try { localStorage.setItem(CHAVE_V, JSON.stringify({ k: k, tx: tx, ty: ty })); } catch (e) {}
}
function limita(v) { return Math.min(MAX, Math.max(MIN, v)); }

// zoom ancorado num ponto do viewport: o ponto sob o cursor nao se move
function zoomEm(px, py, fator) {
  const novo = limita(k * fator);
  if (novo === k) return;
  tx = px - (px - tx) * (novo / k);
  ty = py - (py - ty) * (novo / k);
  k = novo;
  aplica(); guarda();
}
function zoomCentro(fator) {
  zoomEm(canvas.clientWidth / 2, canvas.clientHeight / 2, fator);
}

function ajustar() {
  const anterior = stage.style.transform;
  stage.style.transform = "none";
  const w = stage.offsetWidth, h = stage.offsetHeight;
  stage.style.transform = anterior;
  if (!w || !h) return;
  const margem = 24;
  k = limita(Math.min((canvas.clientWidth - margem) / w, (canvas.clientHeight - margem) / h, 1));
  tx = (canvas.clientWidth - w * k) / 2;
  ty = (canvas.clientHeight - h * k) / 2;
  aplica(); guarda();
}

// rolagem: com Ctrl ou Command da zoom, sem eles move o palco
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) {
    zoomEm(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.01));
  } else {
    tx -= e.deltaX; ty -= e.deltaY;
    aplica(); guarda();
  }
}, { passive: false });

// arrasto: so no vazio do canvas, nunca em cima de um no em edicao
let arrastando = false, ax = 0, ay = 0;
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0 && e.button !== 1) return;
  if (e.target.closest(".nd") || e.target.closest(".hud")) return;
  // Sem isto o navegador inicia uma selecao de texto no ponto do clique e vai estendendo ela por
  // cima dos nos conforme o ponteiro passa, que era o efeito chato de arrastar a tela e sair
  // pintando os cartoes de azul. preventDefault mata a selecao na origem.
  e.preventDefault();
  // preventDefault tambem segura o foco onde estava, entao o blur de quem estava editando um no
  // passa a ser explicito: clicar no vazio continua saindo do campo, como antes.
  const foco = document.activeElement;
  if (foco && foco !== document.body && stage.contains(foco)) foco.blur();
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed) sel.removeAllRanges();
  arrastando = true; ax = e.clientX - tx; ay = e.clientY - ty;
  canvas.classList.add("is-pan");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!arrastando) return;
  tx = e.clientX - ax; ty = e.clientY - ay;
  aplica();
});
function soltar() {
  if (!arrastando) return;
  arrastando = false; canvas.classList.remove("is-pan"); guarda();
}
canvas.addEventListener("pointerup", soltar);
canvas.addEventListener("pointercancel", soltar);

document.getElementById("cv-menos").onclick = () => zoomCentro(1 / 1.2);
document.getElementById("cv-mais").onclick  = () => zoomCentro(1.2);
document.getElementById("cv-fit").onclick   = ajustar;
document.getElementById("cv-um").onclick    = () => { zoomCentro(1 / k); };

render();
(function () {
  let salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(CHAVE_V)); } catch (e) {}
  if (salvo && typeof salvo.k === "number") {
    k = limita(salvo.k); tx = salvo.tx || 0; ty = salvo.ty || 0; aplica();
  } else {
    ajustar();
  }
})();
</script>
